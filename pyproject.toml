[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gap-hamming-disambiguation-certificates"
version = "1.0.0"
description = "Machine-checked Lean 4 & exact-Q Marton coupling, protocol leaf rectangle, XOR-lift, and Omega(n^{2/3}) trajectory certificates for Gap Hamming Distance disambiguations"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Lluis Eriksson"}]

[tool.pytest.ini_options]
testpaths = ["tests"]
